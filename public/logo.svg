<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344" />
      <stop offset="50%" stop-color="#e60011" />
      <stop offset="100%" stop-color="#800000" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffaaaa" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Orbital / Network Rings -->
  <circle cx="200" cy="170" r="130" stroke="#ff2233" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4" fill="none" />
  <circle cx="200" cy="170" r="145" stroke="#ff2233" stroke-width="0.5" opacity="0.3" fill="none" />
  <path d="M 200 25 A 145 145 0 0 1 345 170" stroke="url(#neonRed)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow-subtle)"/>
  
  <!-- Data Chart / AI Activity Line -->
  <path d="M 40 220 L 100 220 L 140 160 L 190 200 L 260 110 L 360 110" stroke="#ff2233" stroke-width="2" fill="none" opacity="0.5" />
  <circle cx="140" cy="160" r="4" fill="#ff2233" />
  <circle cx="190" cy="200" r="4" fill="#ff2233" />
  <circle cx="260" cy="110" r="4" fill="#ff2233" />

  <!-- Central F shape -->
  <g transform="translate(130, 90)">
    <!-- Shadow / Base -->
    <polygon points="-5,5 115,5 95,35 25,35 25,75 85,75 65,105 25,105 25,165 -5,165" fill="#000000" opacity="0.5" filter="url(#glow-subtle)" />
    <!-- Main Body -->
    <polygon points="0,0 120,0 100,30 30,30 30,70 90,70 70,100 30,100 30,160 0,160" fill="url(#neonRed)" filter="url(#glow)" />
    <!-- White Hot Accent -->
    <polygon points="2,2 115,2 97,28 32,28 32,68 85,68 67,98 32,98 32,158 2,158" fill="url(#accent)" opacity="0.8" />
  </g>

  <!-- High-tech crosshairs -->
  <path d="M 200 20 L 200 40 M 200 300 L 200 320 M 50 170 L 70 170 M 330 170 L 350 170" stroke="#ff2233" stroke-width="2" opacity="0.6" />

  <!-- Typography -->
  <text x="200" y="355" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="10">FARID<tspan fill="#ff2233">TECH</tspan></text>
  <text x="200" y="380" font-family="monospace" font-size="13" fill="#ff2233" opacity="0.8" text-anchor="middle" letter-spacing="5">UI · AI · SYSTEMS</text>
</svg>
